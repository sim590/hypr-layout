[package]
name        = "hypr-layout"
version     = "0.1.0"
edition     = "2024"
description = "A CLI tool to launch and arrange tiled window layouts in Hyprland using a simple DSL"
license     = "GPL-3.0-only"
repository  = "https://github.com/sim590/hypr-layout"
authors     = ["Simon Désaulniers"]
keywords    = ["hyprland", "wayland", "tiling", "layout", "window-manager"]
categories  = ["command-line-utilities"]
readme      = "README.md"
include     = [ "src/"
              , "LICENSE"
              , "README.md" 
              ]

[dependencies]
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
serde_json = "1"
